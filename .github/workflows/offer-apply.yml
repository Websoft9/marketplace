# Manual Marketplace ChangeSet apply workflow.
# Configure required reviewers on the <cloud>-marketplace-production environment
# (for example aws-marketplace-production) before using this workflow. The apply
# job waits for that approval.
name: Offer Apply
run-name: "Apply ${{ inputs.update_type }} for ${{ inputs.appid }} to ${{ inputs.cloud }}"

on:
  workflow_dispatch:
    inputs:
      appid:
        description: "appid, e.g. odoo"
        required: true
        type: string
      cloud:
        description: "cloud"
        required: true
        default: aws
        type: choice
        options:
          - aws
      update_type:
        description: "Update type"
        required: true
        default: Product information
        type: choice
        options:
          - Product information
          - Asset
      product_code:
        description: "product code, e.g. xxxx"
        required: false
        type: string
      label:
        description: "Label: force only for the specified code"
        required: false
        type: choice
        default: Auto
        options:
          - Auto
          - Remove label
          - Ubuntu
          - Debian
          - Multisite

permissions:
  contents: read
  id-token: write

concurrency:
  group: marketplace-offer-apply-${{ inputs.cloud }}-${{ inputs.appid }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'Websoft9/marketplace' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP: ${{ inputs.appid }}
      CLOUD: ${{ inputs.cloud }}
      UPDATE_TYPE: ${{ inputs.update_type }}
      CODE: ${{ inputs.product_code }}
      OFFER: ${{ inputs.label }}
      CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID || secrets.CONTENTFUL_SPACE_ID }}
      CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT || 'master' }}
    steps:
      - name: Validate workflow inputs
        run: |
          case "$UPDATE_TYPE" in
            "Product information") ;;
            Asset)
              if [[ -n "$OFFER" && "$OFFER" != "Auto" ]]; then
                echo "::error::Asset updates require Label Auto; labels only affect product information."
                exit 1
              fi
              ;;
            *) echo "::error::Unsupported update type."; exit 1 ;;
          esac
          if [[ -n "$OFFER" && "$OFFER" != "Auto" && -z "${CODE//[[:space:]]/}" ]]; then
            echo "::error::Label requires a product code."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install CLI
        run: python -m pip install --disable-pip-version-check '.[aws]'

      - name: Check cloud and plan role configuration
        env:
          PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN || vars.AWS_ROLE_ARN }}
        run: mk offer doctor --cloud "$CLOUD" --plan-role-arn "$PLAN_ROLE_ARN"

      - name: Preflight application
        run: |
          mkdir -p /tmp/opencode/offer-run
          mk offer preflight \
            --app "$APP" \
            --cloud "$CLOUD" \
            --skip-code-check \
            --output /tmp/opencode/offer-run/preflight.json
          mk offer report preflight \
            --input /tmp/opencode/offer-run/preflight.json >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose Contentful configuration
        env:
          SPACE_VAR: ${{ vars.CONTENTFUL_SPACE_ID != '' }}
          SPACE_SECRET: ${{ secrets.CONTENTFUL_SPACE_ID != '' }}
          TOKEN_SECRET: ${{ secrets.CONTENTFUL_TOKEN != '' }}
          TOKEN_VAR: ${{ vars.CONTENTFUL_TOKEN != '' }}
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository owner: $GITHUB_REPOSITORY_OWNER"
          echo "CONTENTFUL_SPACE_ID variable: $SPACE_VAR"
          echo "CONTENTFUL_SPACE_ID secret: $SPACE_SECRET"
          echo "CONTENTFUL_TOKEN secret: $TOKEN_SECRET"
          echo "CONTENTFUL_TOKEN variable: $TOKEN_VAR"

      - name: Pull Contentful application data
        env:
          CONTENTFUL_TOKEN: ${{ secrets.CONTENTFUL_TOKEN }}
        run: |
          if [[ -z "$CONTENTFUL_SPACE_ID" ]]; then
            echo "::error::CONTENTFUL_SPACE_ID is empty. If it is an organization variable/secret, grant this repository access under Organization settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ -z "$CONTENTFUL_TOKEN" ]]; then
            echo "::error::CONTENTFUL_TOKEN is empty. If it is an organization secret, grant this repository access under Organization settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          mkdir -p /tmp/opencode/offer-run
          mk catalog pull \
            --apps "$APP" \
            --skip-offer-codes \
            --output /tmp/opencode/offer-run/catalog.json \
            --environment "$CONTENTFUL_ENVIRONMENT"

      - name: Snapshot application versions
        run: |
          mk offer versions --output /tmp/opencode/offer-run/apps-verson.json

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: MarketplaceOfferPlan-${{ github.run_id }}

      - name: Snapshot public store inventory
        run: |
          mk store products \
            --platform "$CLOUD" \
            --visibility public \
            --json > /tmp/opencode/offer-run/inventory.json

      - name: Resolve public offer targets from store facts
        run: |
          args=()
          if [[ -n "$CODE" ]]; then
            args+=("--code=$CODE")
          fi
          case "$OFFER" in
            Auto|"") ;;
            "Remove label") args+=("--offer=base") ;;
            *) args+=("--offer=$OFFER") ;;
          esac
          mk offer resolve \
            --app "$APP" \
            --cloud "$CLOUD" \
            --visibility public \
            --inventory /tmp/opencode/offer-run/inventory.json \
            --catalog /tmp/opencode/offer-run/catalog.json \
            --versions /tmp/opencode/offer-run/apps-verson.json \
            "${args[@]}" \
            --output /tmp/opencode/offer-run/resolve.json
          mk offer report resolve \
            --input /tmp/opencode/offer-run/resolve.json >> "$GITHUB_STEP_SUMMARY"

      - name: Build preview
        run: |
          if [[ "$UPDATE_TYPE" == "Asset" ]]; then
            mk offer assets build \
              --app "$APP" \
              --catalog /tmp/opencode/offer-run/catalog.json \
              --output /tmp/opencode/offer-run/assets.json
            cp /tmp/opencode/offer-run/assets.json /tmp/opencode/offer-run/preview.json
          else
            mk offer build \
              --app "$APP" \
              --cloud "$CLOUD" \
              --catalog /tmp/opencode/offer-run/catalog.json \
              --versions /tmp/opencode/offer-run/apps-verson.json \
              --output "data/.work/$CLOUD/$APP.json"
            cp "data/.work/$CLOUD/$APP.json" /tmp/opencode/offer-run/preview.json
          fi

      - name: Generate revision-bound plan
        run: |
          args=()
          if [[ "$UPDATE_TYPE" == "Asset" ]]; then
            args+=(--assets /tmp/opencode/offer-run/assets.json)
          fi
          mk offer plan \
            --app "$APP" \
            --catalog /tmp/opencode/offer-run/catalog.json \
            --versions /tmp/opencode/offer-run/apps-verson.json \
            --all-codes \
            "${args[@]}" \
            --output /tmp/opencode/offer-run/plan.json

      - name: Summarize plan
        run: |
          echo "### Update type: $UPDATE_TYPE" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$UPDATE_TYPE" == "Asset" ]]; then
            echo "Refresh already-uploaded images, even when URLs are unchanged. Keep source images unchanged until AWS processing completes." >> "$GITHUB_STEP_SUMMARY"
          fi
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          mk offer report plan \
            --input /tmp/opencode/offer-run/plan.json \
            --cloud "$CLOUD" \
            --account-id "$ACCOUNT_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reviewed plan
        uses: actions/upload-artifact@v7
        with:
          name: offer-plan-${{ inputs.cloud }}-${{ inputs.appid }}-${{ github.run_id }}
          path: /tmp/opencode/offer-run/
          if-no-files-found: error

  apply:
    needs: plan
    if: github.repository == 'Websoft9/marketplace' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.cloud }}-marketplace-production
    env:
      APP: ${{ inputs.appid }}
      CLOUD: ${{ inputs.cloud }}
      UPDATE_TYPE: ${{ inputs.update_type }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install CLI
        run: python -m pip install --disable-pip-version-check '.[aws]'

      - name: Download reviewed plan
        uses: actions/download-artifact@v8
        with:
          name: offer-plan-${{ inputs.cloud }}-${{ inputs.appid }}-${{ github.run_id }}
          path: /tmp/opencode/offer-run

      - name: Check cloud and apply role configuration
        env:
          APPLY_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN || vars.AWS_ROLE_ARN }}
        run: mk offer doctor --cloud "$CLOUD" --apply-role-arn "$APPLY_ROLE_ARN"

      - name: Show actual OIDC subject
        run: |
          token_json="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          export OIDC_TOKEN_JSON="$token_json"
          python3 - <<'PY'
          import base64
          import json
          import os

          token = json.loads(os.environ["OIDC_TOKEN_JSON"])["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(f"OIDC subject: {claims.get('sub')}")
          print(f"OIDC audience: {claims.get('aud')}")
          PY

      - name: Configure write AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: MarketplaceOfferApply-${{ github.run_id }}

      - name: Submit reviewed plan
        run: |
          args=()
          case "$UPDATE_TYPE" in
            Asset)
              plan_hash="$(python3 -c 'import json; print(json.load(open("/tmp/opencode/offer-run/plan.json"))["planHash"])')"
              args+=(--assets /tmp/opencode/offer-run/assets.json --approve-plan-hash "$plan_hash")
              ;;
            "Product information") ;;
            *) echo "::error::Unsupported update type."; exit 1 ;;
          esac
          status=0
          mk offer apply \
            --app "$APP" \
            --catalog /tmp/opencode/offer-run/catalog.json \
            --versions /tmp/opencode/offer-run/apps-verson.json \
            --plan /tmp/opencode/offer-run/plan.json \
            "${args[@]}" \
            --wait-seconds 0 > /tmp/opencode/offer-run/apply.json || status=$?
          cat /tmp/opencode/offer-run/apply.json
          if [[ ! -s /tmp/opencode/offer-run/apply.json ]]; then
            echo "Apply produced no result document; see the job log above." >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          echo "### Update type: $UPDATE_TYPE" >> "$GITHUB_STEP_SUMMARY"
          mk offer report apply \
            --input /tmp/opencode/offer-run/apply.json \
            --cloud "$CLOUD" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
