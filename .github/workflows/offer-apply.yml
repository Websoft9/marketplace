# Manual Marketplace ChangeSet apply workflow.
# Configure required reviewers on the aws-marketplace-production environment
# before using this workflow. The apply job waits for that approval.
name: Marketplace Offer Apply
run-name: "Apply ${{ inputs.app_name || inputs.app }} to ${{ inputs.cloud }}"

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Application id from the catalog, for example odoo"
        required: true
        type: string
      app_name:
        description: "Optional application display name for the run, for example Odoo"
        required: false
        type: string
      cloud:
        description: "Target cloud platform (currently only aws is implemented)"
        required: true
        default: aws
        type: choice
        options:
          - aws
      offer_codes:
        description: "Optional comma-separated AWS offer codes/SKUs. Default: every code recorded for the application."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: marketplace-offer-apply-${{ inputs.cloud }}-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'Websoft9/marketplace' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP: ${{ inputs.app }}
      APP_NAME: ${{ inputs.app_name || inputs.app }}
      CLOUD: ${{ inputs.cloud }}
      OFFER_CODES: ${{ inputs.offer_codes }}
      CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID || secrets.CONTENTFUL_SPACE_ID }}
      CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT || 'master' }}
    steps:
      - name: Validate inputs
        run: |
          lowered="$(printf '%s' "$APP" | tr '[:upper:]' '[:lower:]')"
          if [[ "$APP" != "$lowered" ]]; then
            echo "::error::app must be lowercase; use '$lowered' instead of '$APP'"
            exit 1
          fi
          if [[ ! "$APP" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::app must be a lowercase application id, for example odoo"
            exit 1
          fi
          if [[ "$CLOUD" != "aws" ]]; then
            echo "::error::Only cloud=aws is implemented by the current apply workflow."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install CLI
        run: python -m pip install --disable-pip-version-check '.[aws]'

      - name: Preflight application and offer codes
        run: |
          mkdir -p /tmp/opencode/offer-run
          args=()
          if [[ -n "$OFFER_CODES" ]]; then
            args+=("--offer-codes=$OFFER_CODES")
          fi
          mk offer preflight \
            --app "$APP" \
            --cloud "$CLOUD" \
            "${args[@]}" \
            --output /tmp/opencode/offer-run/preflight.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          value = json.loads(Path("/tmp/opencode/offer-run/preflight.json").read_text(encoding="utf-8"))
          print(f"## Offer apply: `{value['app']}`")
          print()
          print(f"- Cloud: `{value['cloud']}`")
          print(f"- Offer code source: {value['codeSource']}")
          print(f"- Targets: {len(value['codes'])}")
          print()
          print("| # | Offer code |")
          print("| --- | --- |")
          for index, code in enumerate(value["codes"], start=1):
              print(f"| {index} | `{code}` |")
          PY

      - name: Diagnose Contentful configuration
        env:
          SPACE_VAR: ${{ vars.CONTENTFUL_SPACE_ID != '' }}
          SPACE_SECRET: ${{ secrets.CONTENTFUL_SPACE_ID != '' }}
          TOKEN_SECRET: ${{ secrets.CONTENTFUL_TOKEN != '' }}
          TOKEN_VAR: ${{ vars.CONTENTFUL_TOKEN != '' }}
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository owner: $GITHUB_REPOSITORY_OWNER"
          echo "CONTENTFUL_SPACE_ID variable: $SPACE_VAR"
          echo "CONTENTFUL_SPACE_ID secret: $SPACE_SECRET"
          echo "CONTENTFUL_TOKEN secret: $TOKEN_SECRET"
          echo "CONTENTFUL_TOKEN variable: $TOKEN_VAR"

      - name: Pull Contentful application data
        env:
          CONTENTFUL_TOKEN: ${{ secrets.CONTENTFUL_TOKEN }}
        run: |
          if [[ -z "$CONTENTFUL_SPACE_ID" ]]; then
            echo "::error::CONTENTFUL_SPACE_ID is empty. If it is an organization variable/secret, grant this repository access under Organization settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ -z "$CONTENTFUL_TOKEN" ]]; then
            echo "::error::CONTENTFUL_TOKEN is empty. If it is an organization secret, grant this repository access under Organization settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          mkdir -p /tmp/opencode/offer-run
          mk catalog pull \
            --apps "$APP" \
            --output /tmp/opencode/offer-run/catalog.json \
            --environment "$CONTENTFUL_ENVIRONMENT"

      - name: Snapshot application versions
        run: |
          versions_url="$(python3 -c 'import json; print(json.load(open("config/app.json"))["sources"]["versions"])')"
          curl -fsSL "$versions_url" -o /tmp/opencode/offer-run/apps-verson.json

      - name: Build preview
        run: |
          mk offer build \
            --app "$APP" \
            --cloud "$CLOUD" \
            --catalog /tmp/opencode/offer-run/catalog.json \
            --versions /tmp/opencode/offer-run/apps-verson.json \
            --output "data/.catalog/$CLOUD/$APP.json"
          cp "data/.catalog/$CLOUD/$APP.json" /tmp/opencode/offer-run/preview.json

      - name: Check AWS plan role
        env:
          AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN || vars.AWS_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_PLAN_ROLE_ARN" ]]; then
            echo "::error::Configure AWS_PLAN_ROLE_ARN, or AWS_ROLE_ARN, as a repository variable."
            exit 1
          fi
          if [[ ! "$AWS_PLAN_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]]; then
            echo "::error::AWS_PLAN_ROLE_ARN must be an IAM role ARN."
            exit 1
          fi

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: MarketplaceOfferPlan-${{ github.run_id }}

      - name: Resolve Catalog EntityIds
        run: |
          args=()
          if [[ -n "$OFFER_CODES" ]]; then
            args+=("--offer-codes=$OFFER_CODES")
          fi
          mk offer targets \
            --app "$APP" \
            --cloud "$CLOUD" \
            --catalog /tmp/opencode/offer-run/catalog.json \
            "${args[@]}" \
            --output /tmp/opencode/offer-run/targets.json

      - name: Generate revision-bound plan
        run: |
          mk offer plan \
            --app "$APP" \
            --catalog /tmp/opencode/offer-run/catalog.json \
            --versions /tmp/opencode/offer-run/apps-verson.json \
            --all-codes \
            --output /tmp/opencode/offer-run/plan.json

      - name: Summarize plan
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)" \
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import html
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path("/tmp/opencode/offer-run/plan.json").read_text(encoding="utf-8"))
          app = os.environ["APP"]
          app_name = os.environ["APP_NAME"]
          account_id = os.environ["ACCOUNT_ID"]
          title = app if app_name == app else f"{app_name} (`{app}`)"
          targets = plan.get("targets") or [
              {"code": None, "entityId": plan.get("baseRevision", "").split("@")[0], "plan": plan}
          ]
          pending = sum(1 for target in targets if target["plan"].get("request"))

          print(f"## Offer plan: {title}")
          print()
          print(f"- Cloud: `{os.environ['CLOUD']}`")
          print(f"- Source hash: `{plan.get('sourceHash')}`")
          print(f"- Plan hash: `{plan.get('planHash', '')}`")
          print(f"- Publish blockers: {', '.join(plan.get('publishBlockers') or []) or 'none'}")
          print(f"- Targets: {len(targets)} ({pending} with pending changes)")
          print()

          print("| Offer code | Entity ARN | Base revision | Pending fields |")
          print("| --- | --- | --- | --- |")
          for target in targets:
              entity_arn = (
                  f"arn:aws:aws-marketplace:us-east-1:{account_id}:"
                  f"AWSMarketplace/AmiProduct/{target['entityId']}"
              )
              print(
                  f"| `{target.get('code') or '-'}` | `{entity_arn}` | "
                  f"`{target['plan'].get('baseRevision')}` | "
                  f"{len(target['plan'].get('diff') or {})} |"
              )
          print()

          if not pending:
              print("No cloud change is required.")
          else:
              def display(value):
                  if value is None:
                      return "(not set)"
                  if isinstance(value, str):
                      return value
                  return json.dumps(value, ensure_ascii=False, indent=2)

              print("### Pending updates")
              print()
              for target in targets:
                  diff = target["plan"].get("diff") or {}
                  if not diff:
                      continue
                  print(f"#### {target.get('code') or target['entityId']}")
                  print()
                  for field, change in diff.items():
                      before = display(change.get("before"))
                      after = display(change.get("after"))
                      print("<details>")
                      print(f"<summary><code>{html.escape(field)}</code></summary>")
                      print()
                      print("**Before**")
                      print()
                      print(f"<pre>{html.escape(before)}</pre>")
                      print()
                      print("**After**")
                      print()
                      print(f"<pre>{html.escape(after)}</pre>")
                      print()
                      print("</details>")
                      print()

              print("The complete request is stored in the workflow artifact for review.")
          PY

      - name: Upload reviewed plan
        uses: actions/upload-artifact@v7
        with:
          name: offer-plan-${{ inputs.cloud }}-${{ inputs.app }}-${{ github.run_id }}
          path: /tmp/opencode/offer-run/
          if-no-files-found: error

  apply:
    needs: plan
    if: github.repository == 'Websoft9/marketplace' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.cloud }}-marketplace-production
    env:
      APP: ${{ inputs.app }}
      APP_NAME: ${{ inputs.app_name || inputs.app }}
      CLOUD: ${{ inputs.cloud }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install CLI
        run: python -m pip install --disable-pip-version-check '.[aws]'

      - name: Download reviewed plan
        uses: actions/download-artifact@v8
        with:
          name: offer-plan-${{ inputs.cloud }}-${{ inputs.app }}-${{ github.run_id }}
          path: /tmp/opencode/offer-run

      - name: Check cloud support
        run: |
          if [[ "$CLOUD" != "aws" ]]; then
            echo "::error::Only cloud=aws is implemented by the current apply workflow."
            exit 1
          fi

      - name: Check AWS apply role
        env:
          AWS_APPLY_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN || vars.AWS_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_APPLY_ROLE_ARN" ]]; then
            echo "::error::Configure AWS_APPLY_ROLE_ARN, or AWS_ROLE_ARN, as a variable on the $CLOUD-marketplace-production environment."
            exit 1
          fi
          if [[ ! "$AWS_APPLY_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]]; then
            echo "::error::AWS_APPLY_ROLE_ARN must be an IAM role ARN."
            exit 1
          fi

      - name: Show actual OIDC subject
        run: |
          token_json="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          export OIDC_TOKEN_JSON="$token_json"
          python3 - <<'PY'
          import base64
          import json
          import os

          token = json.loads(os.environ["OIDC_TOKEN_JSON"])["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(f"OIDC subject: {claims.get('sub')}")
          print(f"OIDC audience: {claims.get('aud')}")
          PY

      - name: Configure write AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: MarketplaceOfferApply-${{ github.run_id }}

      - name: Submit reviewed plan
        run: |
          status=0
          mk offer apply \
            --app "$APP" \
            --catalog /tmp/opencode/offer-run/catalog.json \
            --versions /tmp/opencode/offer-run/apps-verson.json \
            --plan /tmp/opencode/offer-run/plan.json \
            --wait-seconds 0 > /tmp/opencode/offer-run/apply.json || status=$?
          cat /tmp/opencode/offer-run/apply.json
          if [[ ! -s /tmp/opencode/offer-run/apply.json ]]; then
            echo "Apply produced no result document; see the job log above." >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/opencode/offer-run/apply.json").read_text(encoding="utf-8"))
          targets = result.get("targets") or []
          print("### ChangeSet submission")
          print()
          print(f"- Status: `{result.get('status', 'unknown')}`")
          print()
          if targets:
              print("| Offer code | EntityId | Status | ChangeSetId |")
              print("| --- | --- | --- | --- |")
              for target in targets:
                  print(
                      f"| `{target.get('code') or '-'}` | `{target.get('entityId')}` | "
                      f"`{target.get('status')}` | `{target.get('changeSetId', '-')}` |"
                  )
              print()
          elif result.get("changeSetId"):
              print(f"- ChangeSetId: `{result['changeSetId']}`")
              print(f"- Plan hash: `{result.get('planHash', '')}`")
              print()
          if result.get("skipped"):
              print(f"Skipped offer codes: {', '.join(str(code) for code in result['skipped'])}")
              print()
          if result.get("status") == "PARTIAL":
              print("At least one target was not submitted. Re-run the workflow to plan the remaining targets; "
                    "already-updated targets plan to NO_CHANGES.")
              print()
          print("Workflow success confirms AWS accepted every ChangeSet. It does not await review, approval, or publication.")
          PY
          exit "$status"
