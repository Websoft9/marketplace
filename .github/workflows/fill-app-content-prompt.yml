name: Fill App Content Prompt

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  fill-prompt:
    if: |
      github.event.issue.body != null &&
      contains(github.event.issue.body, '<!-- app-content-update-issue -->') &&
      contains(github.event.issue.body, '<issue-number>') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fill issue number in prompt
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          body=$(gh issue view "$ISSUE_NUMBER" --repo "$REPOSITORY" --json body --jq .body)
          updated=${body//<issue-number>/$ISSUE_NUMBER}
          if [[ "$updated" == "$body" ]]; then
            echo "No placeholder to replace."
            exit 0
          fi
          jq -n --arg body "$updated" '{body: $body}' \
            | gh api --method PATCH "repos/$REPOSITORY/issues/$ISSUE_NUMBER" --input -
