name: Offer Codes Matrix
run-name: "Offer Codes Matrix - ${{ inputs.platform == 'all' && 'all clouds' || inputs.platform }}"

# Generate the combined offer-code matrix from live public store facts.
# The generated matrix is published as a workflow artifact and to R2; it is not
# committed. `mk offer-codes gen` replaces only the selected platform scope, so the
# platforms are generated sequentially into one matrix file.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Cloud platform to generate"
        type: choice
        required: true
        default: all
        options:
          - all
          - aws
          - aliyun
          - alibabacloud
          - azure
          - azure-vmlab
          - huaweiyun
          - huaweicloud
          - googlecloud

permissions:
  contents: read
  id-token: write

concurrency:
  group: offer-codes-matrix-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLATFORM: ${{ inputs.platform }}
      MATRIX_DIR: /tmp/opencode/offer-matrix
      MATRIX_FILE: /tmp/opencode/offer-matrix/matrix.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install CLI
        run: python -m pip install --disable-pip-version-check '.[aws,aliyun]'

      - name: Check AWS role configuration
        id: aws_config
        continue-on-error: true
        if: env.PLATFORM == 'aws' || env.PLATFORM == 'all'
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_ROLE_ARN" ]]; then
            echo "::error::Configure the AWS_ROLE_ARN Actions variable and allow this repository to assume the role with GitHub OIDC."
            exit 1
          fi
          if [[ ! "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]]; then
            echo "::error::AWS_ROLE_ARN must be an IAM role ARN, not an OIDC provider ARN."
            exit 1
          fi

      - name: Configure AWS credentials with GitHub OIDC
        id: aws_auth
        continue-on-error: true
        if: (env.PLATFORM == 'aws' || env.PLATFORM == 'all') && steps.aws_config.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: MarketplaceOfferCodesMatrix-${{ github.run_id }}

      - name: Check Aliyun role configuration
        id: aliyun_config
        continue-on-error: true
        if: env.PLATFORM == 'aliyun' || env.PLATFORM == 'all'
        env:
          ALIYUN_ROLE_ARN: ${{ vars.ALIYUN_ROLE_ARN }}
          ALIYUN_OIDC_PROVIDER_ARN: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
        run: |
          if [[ -z "$ALIYUN_ROLE_ARN" || -z "$ALIYUN_OIDC_PROVIDER_ARN" ]]; then
            echo "::error::Configure ALIYUN_ROLE_ARN and ALIYUN_OIDC_PROVIDER_ARN as GitHub Actions variables."
            exit 1
          fi

      - name: Configure Aliyun credentials with GitHub OIDC
        id: aliyun_auth
        continue-on-error: true
        if: (env.PLATFORM == 'aliyun' || env.PLATFORM == 'all') && steps.aliyun_config.outcome == 'success'
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          role-to-assume: ${{ vars.ALIYUN_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          role-session-name: MarketplaceOfferCodesMatrix-${{ github.run_id }}
          audience: sts.aliyuncs.com

      - name: Expose Aliyun credential names
        id: aliyun_export
        continue-on-error: true
        if: (env.PLATFORM == 'aliyun' || env.PLATFORM == 'all') && steps.aliyun_auth.outcome == 'success'
        run: |
          {
            echo "ALIYUN_ACCESS_KEY_ID=$ALIBABA_CLOUD_ACCESS_KEY_ID"
            echo "ALIYUN_ACCESS_KEY_SECRET=$ALIBABA_CLOUD_ACCESS_KEY_SECRET"
            echo "ALIYUN_SECURITY_TOKEN=$ALIBABA_CLOUD_SECURITY_TOKEN"
          } >> "$GITHUB_ENV"

      - name: Report Aliyun caller identity
        # Diagnostic only; a failed STS identity check must not suppress other clouds.
        continue-on-error: true
        if: (env.PLATFORM == 'aliyun' || env.PLATFORM == 'all') && steps.aliyun_export.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json
          import os

          from aliyunsdkcore.auth.credentials import StsTokenCredential
          from aliyunsdkcore.client import AcsClient
          from aliyunsdkcore.request import CommonRequest

          from cli.alibaba_credentials import explicit_credential_environment

          access_key_id = os.environ["ALIYUN_ACCESS_KEY_ID"]
          access_key_secret = os.environ["ALIYUN_ACCESS_KEY_SECRET"]
          security_token = os.environ.get("ALIYUN_SECURITY_TOKEN", "")
          if security_token:
              credential = StsTokenCredential(
                  access_key_id, access_key_secret, security_token
              )
              with explicit_credential_environment():
                  client = AcsClient(
                      region_id="cn-hangzhou", credential=credential, timeout=30
                  )
          else:
              client = AcsClient(access_key_id, access_key_secret, "cn-hangzhou", timeout=30)

          request = CommonRequest()
          request.set_method("POST")
          request.set_protocol_type("https")
          request.set_domain("sts.aliyuncs.com")
          request.set_version("2015-04-01")
          request.set_action_name("GetCallerIdentity")
          request.set_accept_format("json")
          identity = json.loads(client.do_action_with_exception(request))
          account_id = str(identity.get("AccountId") or "")
          print(f"Aliyun caller account: {account_id}")
          print(f"Aliyun caller ARN: {identity.get('Arn')}")
          config = json.load(open("config/marketplace.json", encoding="utf-8"))
          aliyun = next(
              (item for item in config.get("platforms", []) if item.get("key") == "aliyun"),
              {},
          )
          expected_account_id = str((aliyun.get("supplier") or {}).get("uid") or "")
          if not expected_account_id:
              print("::warning::config/marketplace.json has no aliyun.supplier.uid; skipping account check")
          elif account_id != expected_account_id:
              print(
                  "::warning::The assumed Aliyun role is not in the known seller account "
                  f"{expected_account_id}. Verify ALIYUN_ROLE_ARN if DescribeProducts fails."
              )
          PY

      # Alibaba Cloud International is a separate account from Aliyun China.
      # Its store inventory now reads the authenticated Market API and verifies
      # visibility against the public storefront, so these credentials are
      # required. Keep this after "Expose Aliyun credential names": the action
      # overwrites the shared ALIBABA_CLOUD_* variables with the international
      # account's values, while ALIYUN_* is already preserved for China.
      - name: Check Alibaba Cloud International role configuration
        id: alibabacloud_config
        continue-on-error: true
        if: env.PLATFORM == 'alibabacloud' || env.PLATFORM == 'all'
        env:
          ROLE_ARN: ${{ vars.ALIBABACLOUD_ROLE_ARN || vars.ALIBABA_CLOUD_ROLE_ARN }}
          OIDC_PROVIDER_ARN: ${{ vars.ALIBABACLOUD_OIDC_PROVIDER_ARN || vars.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
        run: |
          if [[ -z "$ROLE_ARN" || -z "$OIDC_PROVIDER_ARN" ]]; then
            echo "::error::Configure ALIBABACLOUD_ROLE_ARN and ALIBABACLOUD_OIDC_PROVIDER_ARN as GitHub Actions variables (ALIBABA_CLOUD_* names are also accepted)."
            exit 1
          fi
          if [[ ! "$ROLE_ARN" =~ ^acs:ram::([0-9]{12,20}):role/[^/]+$ ]]; then
            echo "::error::ALIBABACLOUD_ROLE_ARN must be a RAM role ARN (acs:ram::<account-id>:role/<role-name>)."
            exit 1
          fi
          role_account_id="${BASH_REMATCH[1]}"
          if [[ ! "$OIDC_PROVIDER_ARN" =~ ^acs:ram::([0-9]{12,20}):oidc-provider/[^/]+$ ]]; then
            echo "::error::ALIBABACLOUD_OIDC_PROVIDER_ARN must be an OIDC provider ARN (acs:ram::<account-id>:oidc-provider/<provider-name>)."
            exit 1
          fi
          provider_account_id="${BASH_REMATCH[1]}"
          if [[ "$role_account_id" != "$provider_account_id" ]]; then
            echo "::error::The Alibaba Cloud International RAM role and OIDC provider ARNs must belong to the same account."
            exit 1
          fi

      - name: Configure Alibaba Cloud International credentials with GitHub OIDC
        id: alibabacloud_auth
        continue-on-error: true
        if: (env.PLATFORM == 'alibabacloud' || env.PLATFORM == 'all') && steps.alibabacloud_config.outcome == 'success'
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          role-to-assume: ${{ vars.ALIBABACLOUD_ROLE_ARN || vars.ALIBABA_CLOUD_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIBABACLOUD_OIDC_PROVIDER_ARN || vars.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          role-session-name: MarketplaceOfferCodesMatrix-${{ github.run_id }}
          audience: sts.aliyuncs.com

      - name: Check Azure publisher credentials
        id: azure_config
        continue-on-error: true
        if: env.PLATFORM == 'azure' || env.PLATFORM == 'all'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure $name for Azure Marketplace (websoft9inc). AZURE_CLIENT_SECRET must be an Actions secret."
              exit 1
            fi
          done

      - name: Check Azure VMLab publisher credentials
        id: azure_vmlab_config
        continue-on-error: true
        if: env.PLATFORM == 'azure-vmlab' || env.PLATFORM == 'all'
        env:
          AZURE_VMLAB_TENANT_ID: ${{ secrets.AZURE_VMLAB_TENANT_ID || vars.AZURE_VMLAB_TENANT_ID }}
          AZURE_VMLAB_CLIENT_ID: ${{ secrets.AZURE_VMLAB_CLIENT_ID || vars.AZURE_VMLAB_CLIENT_ID }}
          AZURE_VMLAB_CLIENT_SECRET: ${{ secrets.AZURE_VMLAB_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for name in AZURE_VMLAB_TENANT_ID AZURE_VMLAB_CLIENT_ID AZURE_VMLAB_CLIENT_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure $name for Azure Marketplace (VMLab). AZURE_VMLAB_CLIENT_SECRET must be an Actions secret."
              exit 1
            fi
          done

      - name: Generate offer-code matrix
        id: generate_matrix
        env:
          AWS_READY: ${{ steps.aws_auth.outcome == 'success' }}
          ALIYUN_READY: ${{ steps.aliyun_export.outcome == 'success' }}
          ALIBABACLOUD_READY: ${{ steps.alibabacloud_auth.outcome == 'success' }}
          AZURE_READY: ${{ steps.azure_config.outcome == 'success' }}
          AZURE_VMLAB_READY: ${{ steps.azure_vmlab_config.outcome == 'success' }}
          AZURE_TENANT_ID: ${{ (env.PLATFORM == 'azure' || env.PLATFORM == 'all') && (secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID) || '' }}
          AZURE_CLIENT_ID: ${{ (env.PLATFORM == 'azure' || env.PLATFORM == 'all') && (secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID) || '' }}
          AZURE_CLIENT_SECRET: ${{ (env.PLATFORM == 'azure' || env.PLATFORM == 'all') && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_VMLAB_TENANT_ID: ${{ (env.PLATFORM == 'azure-vmlab' || env.PLATFORM == 'all') && (secrets.AZURE_VMLAB_TENANT_ID || vars.AZURE_VMLAB_TENANT_ID) || '' }}
          AZURE_VMLAB_CLIENT_ID: ${{ (env.PLATFORM == 'azure-vmlab' || env.PLATFORM == 'all') && (secrets.AZURE_VMLAB_CLIENT_ID || vars.AZURE_VMLAB_CLIENT_ID) || '' }}
          AZURE_VMLAB_CLIENT_SECRET: ${{ (env.PLATFORM == 'azure-vmlab' || env.PLATFORM == 'all') && secrets.AZURE_VMLAB_CLIENT_SECRET || '' }}
        run: |
          set -uo pipefail
          echo "complete=false" >> "$GITHUB_OUTPUT"
          mkdir -p "$MATRIX_DIR"
          : > "$MATRIX_DIR/platform-status.tsv"

          case "$PLATFORM" in
            # Both Huawei sites use public guest seller search: no credential exchange
            # or OIDC is needed, and no credentials are sent to that website interface.
            all) platforms=(aws aliyun alibabacloud azure azure-vmlab huaweiyun huaweicloud googlecloud) ;;
            aws|aliyun|alibabacloud|azure|azure-vmlab|huaweiyun|huaweicloud|googlecloud) platforms=("$PLATFORM") ;;
            *) echo "::error::Unsupported platform: $PLATFORM"; exit 2 ;;
          esac
          printf '%s\n' "${platforms[@]}" > "$MATRIX_DIR/platforms.txt"

          status=0
          for current in "${platforms[@]}"; do
            echo "Generating matrix for ${current}..."
            report="$MATRIX_DIR/generation-${current}.json"
            ready=true
            case "$current" in
              aws) ready="$AWS_READY" ;;
              aliyun) ready="$ALIYUN_READY" ;;
              alibabacloud) ready="$ALIBABACLOUD_READY" ;;
              azure) ready="$AZURE_READY" ;;
              azure-vmlab) ready="$AZURE_VMLAB_READY" ;;
            esac
            if [[ "$ready" != "true" ]]; then
              echo "::error::${current} credential setup failed; only this platform is skipped. Continuing other platforms."
              python3 - "$current" "$report" <<'PY'
          import json
          import sys

          error = {"code": "CredentialSetupFailed", "message": "Platform credential setup failed; see its configuration/authentication step. No inventory queried or matrix mappings written."}
          with open(sys.argv[2], "w", encoding="utf-8") as report:
              json.dump({"schemaVersion": 1, "platform": sys.argv[1], "written": False,
                         "checked": 0, "matched": 0, "unresolved": [], "products": [],
                         "inventory": {"complete": False, "errors": [error]}, "errors": []}, report, indent=2)
          PY
              printf '%s\t%s\n' "$current" "credential_setup_failed" >> "$MATRIX_DIR/platform-status.tsv"
              status=1
              continue
            fi
            if ! mk offer-codes gen \
              --platform "$current" \
              --output "$MATRIX_FILE" \
              --json > "$report"; then
              echo "::error::offer-codes generation failed for ${current}; see the job log."
              python3 - "$report" <<'PY'
          import json
          import sys

          try:
              report = json.load(open(sys.argv[1], encoding="utf-8"))
          except (OSError, ValueError):
              sys.exit(0)
          if not isinstance(report, dict):
              sys.exit(0)
          messages = []
          for section in ("inventory", "matching"):
              value = report.get(section)
              if isinstance(value, dict):
                  for error in value.get("errors") or []:
                      if isinstance(error, dict):
                          messages.append(
                              f"{section}: {error.get('code', 'error')}: {error.get('message', '')}"
                          )
          for error in report.get("errors") or []:
              if isinstance(error, dict):
                  messages.append(
                      f"generation: {error.get('code', 'error')}: {error.get('message', '')}"
                  )
          for message in messages:
              print(f"::error::{message}")
          if not messages:
              print("No structured error details were emitted.")
          PY
              status=1
              printf '%s\t%s\n' "$current" "generation_failed" >> "$MATRIX_DIR/platform-status.tsv"
            else
              printf '%s\t%s\n' "$current" "success" >> "$MATRIX_DIR/platform-status.tsv"
            fi
          done

          if [[ -f "$MATRIX_FILE" ]]; then
            if ! mk offer-codes verify --offer "$MATRIX_FILE" | tee -a "$GITHUB_STEP_SUMMARY"; then
              echo "::error::Generated matrix failed offer-codes verification."
              status=1
            fi
          else
            echo "::error::No matrix.json was generated."
            status=1
          fi

          python3 - "$status" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          directory = Path(os.environ["MATRIX_DIR"])
          states = dict(line.split("\t", 1) for line in (directory / "platform-status.tsv").read_text().splitlines())
          complete = sys.argv[1] == "0"
          (directory / "run-status.json").write_text(json.dumps({
              "schemaVersion": 1, "complete": complete, "platforms": states,
              "combinedPublishEligible": complete,
          }, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"complete={str(complete).lower()}\n")
          PY
          if [[ "$status" != "0" ]]; then
            echo "::error::One or more platforms or matrix verification failed. All selected platforms were attempted; artifacts contain diagnostics. R2 publication is blocked to protect the complete matrix."
          fi
          exit "$status"

      - name: Summarize generation results
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          directory = Path(os.environ["MATRIX_DIR"])
          platforms_file = directory / "platforms.txt"
          platforms = (
              platforms_file.read_text(encoding="utf-8").split()
              if platforms_file.is_file()
              else []
          )

          rows = []
          error_lines = []
          try:
              run_status = json.loads((directory / "run-status.json").read_text(encoding="utf-8"))
          except (OSError, ValueError):
              run_status = {}
          if not isinstance(run_status, dict):
              run_status = {}
          for platform in platforms:
              path = directory / f"generation-{platform}.json"
              try:
                  report = json.loads(path.read_text(encoding="utf-8"))
                  if not isinstance(report, dict):
                      raise ValueError("generation report must be an object")
              except (OSError, ValueError):
                  rows.append((platform, "failed", "-", "-", "-", "-"))
                  continue
              status = run_status.get("platforms", {}).get(platform, "ok" if report.get("written") else "not written")
              rows.append((
                  platform,
                  status,
                  report.get("checked", "-"),
                  report.get("matched", "-"),
                  len(report.get("unresolved", [])),
                  "yes" if report.get("written") else "no",
              ))
              for section in ("inventory", "matching"):
                  value = report.get(section)
                  if isinstance(value, dict):
                      for error in value.get("errors") or []:
                          if isinstance(error, dict):
                              error_lines.append(
                                  f"- {platform} {section}: "
                                  f"{error.get('code', 'error')}: {error.get('message', '')}"
                              )
              for error in report.get("errors") or []:
                  if isinstance(error, dict):
                      error_lines.append(
                          f"- {platform} generation: "
                          f"{error.get('code', 'error')}: {error.get('message', '')}"
                      )

          lines = [
              "### Offer-code matrix generation",
              "",
              "| Platform | Status | Checked | Matched | Unresolved | Written |",
              "| --- | --- | --- | --- | --- | --- |",
          ]
          lines.extend(
              "| " + " | ".join(str(value) for value in row) + " |"
              for row in rows
          )
          lines.extend(["", "### Publication eligibility",
                        "All selected platforms and matrix verification succeeded; eligible for the R2 publish step."
                        if run_status.get("combinedPublishEligible") is True else
                        "R2 publication blocked: at least one selected platform or matrix verification failed, or generation did not finish. Successful platform results and failure reports remain in the GitHub artifact; the published complete matrix is not overwritten."])
          if error_lines:
              lines.extend(["", "### Errors", *error_lines])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Remove matrix work backups
        if: always()
        run: |
          if [[ -d "$MATRIX_DIR" ]]; then
            find "$MATRIX_DIR" -maxdepth 1 -type f \
              \( -name '.*.bak' -o -name '.*.tmp' \) -delete
          fi

      - name: Upload offer-code matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offer-codes-matrix
          path: ${{ env.MATRIX_DIR }}
          retention-days: 7
          if-no-files-found: warn

      - name: Publish matrix to Cloudflare R2
        if: success() && steps.generate_matrix.outputs.complete == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_SECRET_ID: ${{ secrets.CLOUDFLARE_R2_SECRET_ID || vars.CLOUDFLARE_R2_SECRET_ID }}
          CLOUDFLARE_R2_SECRET_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY || vars.CLOUDFLARE_R2_SECRET_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_SECRET_ID || vars.CLOUDFLARE_R2_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY || vars.CLOUDFLARE_R2_SECRET_KEY }}
          AWS_SESSION_TOKEN: ""
          AWS_REGION: auto
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          unset AWS_SESSION_TOKEN AWS_PROFILE
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_R2_SECRET_ID CLOUDFLARE_R2_SECRET_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure $name as a GitHub Actions secret or variable."
              exit 1
            fi
          done
          if [[ ! -f "$MATRIX_FILE" ]]; then
            echo "::error::No matrix.json to publish."
            exit 1
          fi

          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          if [[ "$PLATFORM" == "all" ]]; then
            destination="s3://artifact/cloud_data/matrix/"
          else
            destination="s3://artifact/cloud_data/matrix/${PLATFORM}/"
          fi

          aws s3 cp "$MATRIX_DIR" "$destination" \
            --recursive \
            --exclude ".*" \
            --endpoint-url "$endpoint" \
            --cache-control "public, max-age=300"
          echo "Published $MATRIX_DIR to $destination"
